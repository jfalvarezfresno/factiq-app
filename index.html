<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FactIQ · Búsquedas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Lato:wght@400;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#042552; --navy-2:#0F4489;
  --verde:#05FF00; --verde-fg:#0A7A05; --verde-bg:#E4F7E2;
  --paper:#F5F7FA; --card:#FFFFFF; --surface-2:#EAEFF5;
  --ink:#0B1A2E; --ink-2:#2E4260; --muted:#5F7089;
  --rule:#D4DCE7; --rule-soft:#E5EAF1;
  --warn:#8A5A00; --warn-bg:#FBF0DA;
  --idle:#5A6878; --idle-bg:#EDF0F4;
  --pip-on:#0A7A05; --pip-off:#DCE3EC;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
.tabular{font-variant-numeric:tabular-nums}

/* ---- tipografia de marca ---- */
h1,h2,.nombre,.score b,.precio .val{
  font-family:"Roboto",Helvetica,Arial,sans-serif;font-weight:700;letter-spacing:-.015em
}
.mono,.cov,.tag,th,.sincontacto,.precio .tit{
  font-family:"Roboto Mono",ui-monospace,monospace;font-weight:500
}
th{font-size:.6875rem;letter-spacing:.07em;text-transform:uppercase;background:var(--surface-2)}
.wordmark{
  font-family:"Bree Serif",Georgia,serif;font-size:20px;color:#FFF;letter-spacing:0
}
.wordmark i{font-style:normal;color:var(--verde)}


/* ---------- login ---------- */
#login{
  min-height:100vh; display:grid; place-items:center; padding:24px;
  background:linear-gradient(180deg,var(--paper) 0%,var(--surface-2) 100%);
}
.loginbox{width:100%;max-width:340px}
.loginmark{font-family:"Bree Serif",Georgia,serif;font-size:34px;color:var(--navy);margin-bottom:18px}
.loginmark i{font-style:normal;color:var(--verde-fg)}
.loginbox h1{font-size:19px;margin:0 0 2px}
.loginbox p{margin:0 0 26px;color:var(--muted);font-size:13px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--card);outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(15,68,137,.14)}
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  padding:9px 15px;border:1px solid var(--navy);border-radius:var(--r);
  background:var(--navy);color:#fff;cursor:pointer;font-weight:700;
  font-family:"Roboto",sans-serif
}
.btn:hover{background:var(--navy-2);border-color:var(--navy-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:var(--surface-2)}
header .btn.ghost{color:#C3D4E1;border-color:var(--navy-2)}
header .btn.ghost:hover{background:var(--navy-2);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.err{color:var(--warn);font-size:13px;margin-top:10px;min-height:18px}

/* ---------- shell ---------- */
header{
  display:flex;align-items:center;gap:18px;
  padding:0 20px;height:56px;background:var(--navy);
  border-bottom:3px solid var(--verde)
}
nav{display:flex;gap:2px;margin-left:8px}
nav button{
  border:0;background:transparent;padding:7px 12px;border-radius:var(--r);
  cursor:pointer;color:#A9C0DC;font-weight:700;font-family:"Roboto",sans-serif
}
nav button:hover{color:#fff}
nav button[aria-current=true]{background:var(--navy-2);color:#fff}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#A9C0DC}
.tag{
  font-size:10px;padding:2px 7px;border-radius:4px;
  background:var(--verde);color:var(--navy)
}
main{padding:20px;max-width:1500px;margin:0 auto}
.hide{display:none !important}

/* ---------- panes ---------- */
.split{display:grid;grid-template-columns:390px 1fr;gap:18px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px}
.card h2{font-size:14px;font-weight:600;margin:0 0 12px}
.card h2 .sub{font-weight:400;color:var(--muted);margin-left:6px}
textarea{min-height:150px;resize:vertical;line-height:1.45}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.faltante input,.faltante select{border-color:var(--warn);background:var(--warn-bg)}
.aviso{
  background:var(--warn-bg);border:1px solid #EADBB5;border-radius:var(--r);
  padding:10px 12px;font-size:13px;margin-top:12px
}
.aviso b{color:var(--warn)}

/* chips de skills */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 8px;
  border:1px solid var(--rule);border-radius:4px;background:var(--surface-2);font-size:13px
}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0;line-height:1}
.chip button:hover{color:var(--warn)}

/* ---------- resultados ---------- */
.rowcard{
  display:grid;grid-template-columns:1fr auto;gap:14px;
  padding:13px 14px;border:1px solid var(--rule);border-radius:8px;
  background:var(--card);margin-bottom:8px;cursor:pointer
}
.rowcard:hover{border-color:var(--navy-2)}
.rowcard[aria-selected=true]{border-color:var(--navy);box-shadow:0 0 0 2px rgba(4,37,82,.10)}
.nombre{font-weight:600}
.meta{color:var(--muted);font-size:13px;margin-top:1px}
.pips{display:flex;gap:3px;margin-top:9px;flex-wrap:wrap}
.pip{width:15px;height:8px;border-radius:2px;background:var(--pip-off)}
.pip.on{background:var(--pip-on)}
.pipwrap{display:flex;align-items:center;gap:9px}
.cov{font-size:12px;color:var(--muted)}
.score{text-align:right;min-width:74px}
.score b{font-size:20px;font-weight:600;letter-spacing:-.02em}
.score span{display:block;font-size:11px;color:var(--muted)}
.sincontacto{
  font-size:10px;color:var(--warn);
  background:var(--warn-bg);padding:1px 6px;border-radius:99px
}
.skilllist{font-size:12.5px;color:var(--ink-2);margin-top:7px}
.skilllist .no{color:var(--warn)}

/* ---------- detalle ---------- */
.detalle{position:sticky;top:20px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:13px;margin-bottom:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.precio{
  border:1px solid var(--rule);border-radius:8px;padding:11px;margin-bottom:8px
}
.precio.elegido{border-color:var(--verde-fg);background:var(--verde-bg)}
.precio .tit{font-size:12px;color:var(--muted)}
.precio .val{font-size:19px;font-weight:600;letter-spacing:-.02em}
.precio .det{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- tabla red ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-weight:600;color:var(--muted);font-size:12px;
  padding:7px 9px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--card)
}
td{padding:8px 9px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:end}
.filtros .field{margin:0;min-width:130px}

/* ---------- modal ---------- */
.modal{
  position:fixed;inset:0;background:rgba(4,37,82,.46);
  display:grid;place-items:center;padding:20px;z-index:50
}
.modal .card{max-width:620px;width:100%;max-height:86vh;overflow:auto}
.modal textarea{min-height:230px}
.modalfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

.vacio{color:var(--muted);padding:30px 4px;text-align:center}
.cargando{color:var(--muted);padding:16px 4px}
.enviado{font-size:12px;color:var(--verde-fg);font-weight:600}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="loginbox">
    <div class="loginmark">Fact<i>IQ</i></div>
    <h1>Búsquedas y red de analistas</h1>
    <p>Data Intelligence for Better Decisions</p>
    <div class="field"><label for="mail">Correo</label>
      <input id="mail" type="email" autocomplete="username"></div>
    <div class="field"><label for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password"></div>
    <button class="btn" id="btnLogin" style="width:100%;margin-top:6px">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hide">
  <header>
    <span class="wordmark">Fact<i>IQ</i></span>
    <nav>
      <button data-vista="buscar" aria-current="true">Búsqueda</button>
      <button data-vista="red">Red de analistas</button>
    </nav>
    <div class="who">
      <span id="quien"></span>
      <button class="btn ghost sm" id="btnSalir">Salir</button>
    </div>
  </header>

  <main>
    <!-- ---------- VISTA BUSCAR ---------- -->
    <section id="vistaBuscar">
      <div class="split">
        <div>
          <div class="card">
            <h2>El pedido</h2>
            <textarea id="jd" placeholder="Pegá acá el Job Description que te mandaron"></textarea>
            <div style="display:flex;gap:8px;margin-top:10px">
              <button class="btn" id="btnAnalizar">Analizar</button>
              <button class="btn ghost" id="btnLimpiar">Limpiar</button>
            </div>
            <div class="err" id="jdErr"></div>
          </div>

          <div class="card hide" id="cardCampos" style="margin-top:14px">
            <h2>Datos del rol <span class="sub" id="contFaltan"></span></h2>
            <div class="field"><label>Título del rol</label><input id="f_titulo" type="text"></div>
            <div class="grid2">
              <div class="field"><label>Budget USD/hora</label>
                <input id="f_budget" type="number" step="0.01" placeholder="por hora"></div>
              <div class="field"><label>Budget USD/mes</label>
                <input id="f_budget_mes" type="number" step="1" placeholder="por mes"></div>
              <div class="field"><label>Duración (meses)</label><input id="f_duracion" type="number"></div>
              <div class="field"><label>Zona horaria</label><input id="f_zona" type="text"></div>
              <div class="field"><label>Seniority</label>
                <select id="f_seniority">
                  <option value="">Sin definir</option>
                  <option value="JR">JR · 1 año</option>
                  <option value="SSR">SSR · 2-3</option>
                  <option value="SSR_ADV">SSR avanzado · 4</option>
                  <option value="SR">SR · 5-10</option>
                  <option value="EXPERT">Experto · +10</option>
                </select></div>
              <div class="field"><label>Idioma</label>
                <select id="f_idioma">
                  <option value="">Sin requisito</option>
                  <option value="ENG">Inglés</option>
                  <option value="ESP">Español</option>
                  <option value="POR">Portugués</option>
                </select></div>
              <div class="field"><label>Nivel de idioma</label>
                <select id="f_nivel">
                  <option value="">Cualquiera</option>
                  <option value="INTERMEDIATE">Intermedio</option>
                  <option value="ADVANCED">Avanzado</option>
                  <option value="PROFESSIONAL">Profesional</option>
                  <option value="NATIVE">Nativo</option>
                </select></div>
            </div>
            <div class="field" style="margin-top:2px">
              <label>Skills clave</label>
              <input id="f_nuevoSkill" type="text" placeholder="Escribí uno y apretá Enter">
              <div class="chips" id="chipsSkills"></div>
            </div>
            <div class="aviso hide" id="avisoFaltan"></div>
            <div style="display:flex;gap:8px;margin-top:14px">
              <button class="btn" id="btnBuscar">Buscar candidatos</button>
              <button class="btn ghost hide" id="btnPedirDatos">Pedir lo que falta</button>
            </div>
            <div style="margin-top:8px">
              <button class="btn ghost sm" id="btnPost">Generar post de LinkedIn</button>
            </div>
          </div>
        </div>

        <div>
          <div class="card">
            <h2>Candidatos <span class="sub" id="contCand"></span></h2>
            <div class="filtros">
              <div class="field"><label>Rate máx USD/h</label><input id="q_rate" type="number" step="0.5"></div>
              <div class="field"><label>Rate máx USD/mes</label><input id="q_rate_mes" type="number" step="10"></div>
              <div class="field"><label>País</label><input id="q_pais" type="text" placeholder="cualquiera"></div>
              <div class="field" style="display:flex;align-items:center;gap:6px;min-width:auto">
                <input id="q_cont" type="checkbox" checked style="width:auto">
                <label for="q_cont" style="margin:0">Solo contactables</label>
              </div>
            </div>
            <div id="resultados"><div class="vacio">Analizá un pedido para ver candidatos.</div></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------- VISTA RED ---------- -->
    <section id="vistaRed" class="hide">
      <div class="card">
        <h2>Red de analistas <span class="sub" id="contRed"></span></h2>
        <div class="filtros">
          <div class="field" style="min-width:210px"><label>Buscar</label>
            <input id="r_q" type="text" placeholder="nombre, tecnología, resumen"></div>
          <div class="field"><label>País</label><input id="r_pais" type="text"></div>
          <div class="field"><label>Seniority</label>
            <select id="r_sen"><option value="">Todos</option><option>JR</option><option>SSR</option>
            <option>SSR_ADV</option><option>SR</option><option>EXPERT</option></select></div>
          <div class="field"><label>Rate máx USD/h</label><input id="r_rate" type="number" step="0.5"></div>
          <div class="field"><label>Rate máx USD/mes</label><input id="r_rate_mes" type="number" step="10"></div>
          <div class="field" style="display:flex;align-items:center;gap:6px;min-width:auto">
            <input id="r_cont" type="checkbox" style="width:auto">
            <label for="r_cont" style="margin:0">Solo contactables</label>
          </div>
          <button class="btn ghost sm" id="btnRecargarRed">Aplicar</button>
        </div>
        <div style="max-height:70vh;overflow:auto">
          <table>
            <thead><tr>
              <th>Nombre</th><th>País</th><th>Sen.</th><th>Años</th>
              <th>USD/h</th><th>USD/mes</th><th>Contacto</th><th>Tecnologías</th>
            </tr></thead>
            <tbody id="tbodyRed"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- ============ MODAL ============ -->
<div class="modal hide" id="modal">
  <div class="card">
    <h2 id="modalTit"></h2>
    <div class="field hide" id="modalAsuntoWrap">
      <label>Asunto</label><input id="modalAsunto" type="text">
    </div>
    <div class="field"><label id="modalLabel">Mensaje</label>
      <textarea id="modalCuerpo"></textarea></div>
    <div class="err" id="modalErr"></div>
    <div class="modalfoot">
      <button class="btn ghost" id="modalCerrar">Cerrar</button>
      <button class="btn ghost" id="modalCopiar">Copiar</button>
      <button class="btn" id="modalMailto">Abrir en el correo</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL = "https://adxuqnccpjmsbkjaxrbb.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkeHVxbmNjcGptc2JramF4cmJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNDMzODYsImV4cCI6MjEwNDgxOTM4Nn0.WS0JeKwhLTuXoy7BFP7T2CZA1nHpXkjXPCytakQpVNc";
const MAIL_4LATAM = "rocio@4latam.com, marcelo@4latam.com";
const HS_MES = 160;
const MARGEN_FIJO = 1000;      // USD por mes
const MARGEN_PCT  = 0.455;     // promedio historico de FactIQ

const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

let YO = null, ROL = null;
let SKILLS = [];
let ULTIMO = null;        // resultado del analisis del JD
let CANDIDATOS = [];
let ELEGIDO = null;

/* ============ login ============ */
async function entrar(){
  $("#loginErr").textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({
    email: $("#mail").value.trim(), password: $("#pass").value
  });
  if (error){ $("#loginErr").textContent = "No pudimos entrar: " + error.message; return; }
  await arrancar(data.user);
}

async function arrancar(user){
  YO = user;
  const { data } = await sb.from("app_users").select("full_name, role").eq("id", user.id).maybeSingle();
  ROL = data?.role ?? null;
  if (!ROL){
    $("#loginErr").textContent = "Tu usuario todavía no tiene un rol asignado. Pedile a un administrador que te lo dé.";
    await sb.auth.signOut(); return;
  }
  $("#quien").innerHTML = (data.full_name || user.email) +
    ` <span class="tag">${ROL === "ADMIN" ? "Admin" : "Reclutadora"}</span>`;
  $("#login").classList.add("hide");
  $("#app").classList.remove("hide");
  cargarRed();
}

/* ============ analizar el JD ============ */
async function llamarIA(tarea, texto){
  const { data: ses } = await sb.auth.getSession();
  const r = await fetch(`${SUPA_URL}/functions/v1/ia`, {
    method:"POST",
    headers:{ "Content-Type":"application/json",
              "Authorization":`Bearer ${ses.session.access_token}` },
    body: JSON.stringify({ tarea, texto })
  });
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.detalle || j.error || "falló la llamada");
  return j.resultado;
}

async function analizar(){
  const texto = $("#jd").value.trim();
  if (texto.length < 60){ $("#jdErr").textContent = "Pegá el texto del pedido, con un poco más de detalle."; return; }
  $("#jdErr").textContent = ""; $("#btnAnalizar").disabled = true;
  $("#btnAnalizar").textContent = "Analizando...";
  try{
    const d = await llamarIA("jd", texto);
    ULTIMO = d;
    $("#f_titulo").value   = d.titulo_rol ?? "";
    const bh = d.budget_usd_hora ?? (d.budget_usd_mes ? d.budget_usd_mes/HS_MES : null);
    $("#f_budget").value     = bh ? Number(bh).toFixed(2) : "";
    $("#f_budget_mes").value = bh ? Math.round(bh*HS_MES) : "";
    $("#f_duracion").value = d.duracion_meses ?? "";
    $("#f_zona").value     = d.zona_horaria ?? "";
    $("#f_seniority").value= d.seniority_requerido ?? "";
    $("#f_idioma").value   = d.idiomas?.[0]?.idioma ?? "";
    $("#f_nivel").value    = d.idiomas?.[0]?.nivel ?? "";
    SKILLS = (d.skills_clave ?? []).map(s => s.skill).filter(Boolean);
    pintarChips(); marcarFaltantes();
    $("#cardCampos").classList.remove("hide");
  }catch(e){
    $("#jdErr").textContent = "No se pudo analizar: " + e.message;
  }finally{
    $("#btnAnalizar").disabled = false; $("#btnAnalizar").textContent = "Analizar";
  }
}

const CAMPOS = [
  ["#f_titulo","Título del rol"], ["#f_budget","Budget"], ["#f_duracion","Duración"],
  ["#f_zona","Zona horaria"], ["#f_idioma","Idioma"]
];

function marcarFaltantes(){
  const faltan = [];
  CAMPOS.forEach(([sel,nom])=>{
    const el = $(sel), vacio = !el.value;
    el.parentElement.classList.toggle("faltante", vacio);
    if (vacio) faltan.push(nom);
  });
  if (!SKILLS.length) faltan.push("Skills clave");
  $("#contFaltan").textContent = faltan.length ? `· faltan ${faltan.length}` : "· completo";
  const av = $("#avisoFaltan");
  if (faltan.length){
    av.innerHTML = `<b>Falta información:</b> ${faltan.join(", ")}. Podés completarlo a mano o pedírselo a 4Latam.`;
    av.classList.remove("hide"); $("#btnPedirDatos").classList.remove("hide");
  } else { av.classList.add("hide"); $("#btnPedirDatos").classList.add("hide"); }
  return faltan;
}

function pintarChips(){
  $("#chipsSkills").innerHTML = SKILLS.map((s,i)=>
    `<span class="chip">${esc(s)}<button data-i="${i}" title="Quitar">&times;</button></span>`).join("");
}

/* ============ buscar candidatos ============ */
async function buscar(){
  if (!SKILLS.length){ $("#jdErr").textContent = "Cargá al menos un skill para buscar."; return; }
  $("#resultados").innerHTML = `<div class="cargando">Buscando en la red...</div>`;
  const { data, error } = await sb.rpc("buscar_candidatos", {
    p_skills: SKILLS,
    p_seniority: $("#f_seniority").value || null,
    p_idioma: $("#f_idioma").value || null,
    p_nivel_idioma: $("#f_nivel").value || null,
    p_pais: $("#q_pais").value.trim() || null,
    p_rate_max: $("#q_rate").value ? Number($("#q_rate").value)
                : ($("#f_budget").value ? Number($("#f_budget").value) : null),
    p_solo_contactables: $("#q_cont").checked,
    p_limite: 40
  });
  if (error){ $("#resultados").innerHTML = `<div class="vacio">No se pudo buscar: ${esc(error.message)}</div>`; return; }
  CANDIDATOS = data || [];
  pintarCandidatos();
}

function pintarCandidatos(){
  $("#contCand").textContent = CANDIDATOS.length ? `· ${CANDIDATOS.length} en la red` : "";
  if (!CANDIDATOS.length){
    $("#resultados").innerHTML = `<div class="vacio">Nadie de la red cubre estos skills.
      Probá sacando algún requisito, o generá el post de LinkedIn para salir a buscar.</div>`;
    return;
  }
  $("#resultados").innerHTML = CANDIDATOS.map((c,i)=>{
    const pips = Array.from({length:c.skills_pedidos},(_,k)=>
      `<span class="pip ${k < c.skills_cubiertos ? "on":""}"></span>`).join("");
    const falta = (c.falta||[]).length
      ? `<span class="no">le falta ${(c.falta||[]).join(", ")}</span>` : "";
    return `
    <div class="rowcard" data-i="${i}" aria-selected="${ELEGIDO===i}">
      <div>
        <div class="nombre">${esc(c.nombre)} ${c.contactable?"":'<span class="sincontacto">sin contacto</span>'}</div>
        <div class="meta">${esc(c.pais||"país no registrado")} · ${c.seniority||"—"} ·
          ${c.anios??"—"} años · ${c.rate?("USD "+c.rate+"/h"):"rate no registrado"}</div>
        <div class="pipwrap"><div class="pips">${pips}</div>
          <span class="cov tabular">${c.skills_cubiertos} de ${c.skills_pedidos}</span></div>
        <div class="skilllist">${esc((c.matchea||[]).slice(0,9).join(", "))} ${falta}</div>
      </div>
      <div class="score"><b class="tabular">${Math.round(c.score)}</b><span>ajuste</span></div>
    </div>`;
  }).join("") + `<div id="panelDetalle"></div>`;
  if (ELEGIDO!==null) pintarDetalle(ELEGIDO);
}

function pintarDetalle(i){
  const c = CANDIDATOS[i]; if(!c) return;
  const costoMes = c.rate ? c.rate*HS_MES : null;
  const budgetH  = $("#f_budget").value ? Number($("#f_budget").value) : null;
  const budgetM  = budgetH ? budgetH*HS_MES : null;

  let bloquePrecio = "";
  if (ROL === "ADMIN"){
    if (!costoMes){
      bloquePrecio = `<div class="aviso">No tenemos el rate de esta persona, así que no se puede calcular el precio. Preguntáselo en el primer mensaje.</div>`;
    } else {
      const a = costoMes + MARGEN_FIJO;
      const b = costoMes * (1 + MARGEN_PCT);
      const fila = (tit,val,extra)=>{
        const fuera = budgetM && val > budgetM;
        return `<div class="precio ${fuera?"":"elegido"}">
          <div class="tit">${tit}</div>
          <div class="val tabular">USD ${Math.round(val).toLocaleString("es-AR")} /mes</div>
          <div class="det tabular">USD ${(val/HS_MES).toFixed(2)}/h · margen ${Math.round(val-costoMes)} USD (${Math.round((val/costoMes-1)*100)}%)</div>
          ${fuera?`<div class="det" style="color:var(--warn)">Se pasa ${Math.round(val-budgetM)} USD del budget</div>`:""}
          ${extra||""}</div>`;
      };
      let alerta = "";
      if (budgetM && Math.min(a,b) > budgetM){
        const margenMax = budgetM - costoMes;
        alerta = `<div class="aviso"><b>Las dos opciones se pasan del budget.</b>
          El máximo que entra es USD ${Math.round(budgetM).toLocaleString("es-AR")}/mes,
          que deja ${Math.round(margenMax)} USD de margen
          (${Math.round((budgetM/costoMes-1)*100)}%).
          ${margenMax < 0 ? "El candidato ya cuesta más que el budget." : ""}</div>`;
      }
      bloquePrecio = `
        <h2 style="margin-top:16px">Precio a 4Latam</h2>
        <div class="det" style="font-size:12px;color:var(--muted);margin-bottom:8px">
          Costo del analista: USD ${Math.round(costoMes).toLocaleString("es-AR")}/mes
          (${c.rate}/h × ${HS_MES} hs)</div>
        ${fila("Margen fijo · 1.000 USD", a)}
        ${fila("Margen histórico · 45,5%", b)}
        ${alerta}`;
    }
  }

  $("#panelDetalle").innerHTML = `
    <div class="card detalle" style="margin-top:14px">
      <h2>${esc(c.nombre)}</h2>
      <dl class="kv">
        <dt>Correo</dt><dd>${c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:"—"}</dd>
        <dt>Teléfono</dt><dd>${esc(c.telefono||"—")}</dd>
        <dt>País</dt><dd>${esc(c.pais||"—")}</dd>
        <dt>Idiomas</dt><dd>${esc(c.idiomas||"—")}</dd>
        <dt>Ajuste</dt><dd class="tabular">${Math.round(c.score)} · cubre ${c.skills_cubiertos} de ${c.skills_pedidos}</dd>
      </dl>
      ${c.resumen?`<div style="font-size:13px;color:var(--ink-2)">${esc(c.resumen)}</div>`:""}
      ${bloquePrecio}
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn" id="btnMensaje" ${c.email?"":"disabled"}>Escribirle</button>
        <button class="btn ghost" id="btnCerrarDet">Cerrar</button>
      </div>
      ${c.email?"":`<div class="det" style="margin-top:6px;color:var(--warn);font-size:12px">
        No tenemos su correo. Buscalo por nombre en LinkedIn.</div>`}
    </div>`;
  $("#panelDetalle").scrollIntoView({behavior:"smooth", block:"nearest"});
}

/* ============ mensajes ============ */
let MODAL_DEST = "";
function abrirModal(tit, asunto, cuerpo, destino){
  $("#modalTit").textContent = tit;
  $("#modalAsuntoWrap").classList.toggle("hide", asunto===null);
  $("#modalAsunto").value = asunto ?? "";
  $("#modalCuerpo").value = cuerpo ?? "";
  $("#modalLabel").textContent = asunto===null ? "Texto" : "Mensaje";
  $("#modalMailto").classList.toggle("hide", !destino && asunto===null);
  MODAL_DEST = destino || "";
  $("#modalErr").textContent = "";
  $("#modal").classList.remove("hide");
}

async function mensajeCandidato(){
  const c = CANDIDATOS[ELEGIDO];
  const ctx = `Candidato: ${c.nombre}. Rol: ${$("#f_titulo").value||"posición de IT"}.
Duración: ${$("#f_duracion").value||"a confirmar"} meses.
Zona horaria: ${$("#f_zona").value||"a confirmar"}.
Modalidad: remoto.
Tecnologías del rol que ya maneja: ${(c.matchea||[]).join(", ")}.`;
  abrirModal("Mensaje para " + c.nombre, "Redactando...", "Redactando...", c.email);
  try{
    const d = await llamarIA("mensaje", ctx);
    $("#modalAsunto").value = d.asunto || "";
    $("#modalCuerpo").value = d.cuerpo || "";
  }catch(e){
    $("#modalErr").textContent = "No se pudo redactar: " + e.message;
    $("#modalAsunto").value = `Oportunidad: ${$("#f_titulo").value||"posición IT"}`;
    $("#modalCuerpo").value = `Hola ${c.nombre.split(" ")[0]},\n\nTenemos una búsqueda abierta que encaja con tu perfil. ¿Estás disponible y te interesaría que charlemos?\n\nEl equipo de FactIQ`;
  }
}

async function pedirDatos(){
  const faltan = marcarFaltantes();
  const ctx = `Rol: ${$("#f_titulo").value||"(sin título)"}.
Datos que faltan en el Job Description: ${faltan.join(", ")}.`;
  abrirModal("Pedido a 4Latam", "Redactando...", "Redactando...", MAIL_4LATAM);
  try{
    const d = await llamarIA("pedido", ctx);
    $("#modalAsunto").value = d.asunto || "";
    $("#modalCuerpo").value = d.cuerpo || "";
  }catch(e){ $("#modalErr").textContent = "No se pudo redactar: " + e.message; }
}

async function generarPost(){
  const ctx = `Rol: ${$("#f_titulo").value}.
Seniority: ${$("#f_seniority").value||"a definir"}.
Duración: ${$("#f_duracion").value||"a definir"} meses.
Zona horaria: ${$("#f_zona").value||"LATAM"}.
Skills: ${SKILLS.join(", ")}.
Preguntas sugeridas: ${(ULTIMO?.preguntas_screening||[]).join(" | ")}`;
  abrirModal("Publicación de LinkedIn", null, "Redactando...", "");
  try{
    const d = await llamarIA("post", ctx);
    $("#modalCuerpo").value = d.post || "";
  }catch(e){ $("#modalErr").textContent = "No se pudo redactar: " + e.message; }
}

/* ============ red ============ */
async function cargarRed(){
  const tb = $("#tbodyRed");
  tb.innerHTML = `<tr><td colspan="8" class="cargando">Cargando...</td></tr>`;
  const vista = ROL === "ADMIN" ? "v_analistas" : "v_analistas_recruiter";
  let q = sb.from(vista).select("*").limit(600);
  const pais = $("#r_pais").value.trim();
  const sen  = $("#r_sen").value;
  const rate = $("#r_rate").value;
  const txt  = $("#r_q").value.trim();
  if (pais) q = q.ilike("pais", `%${pais}%`);
  if (sen)  q = q.eq("seniority", sen);
  if (rate) q = q.lte(ROL==="ADMIN"?"usd_hora":"usd_hora_candidato", Number(rate));
  const { data, error } = await q;
  if (error){ tb.innerHTML = `<tr><td colspan="8" class="vacio">${esc(error.message)}</td></tr>`; return; }
  let filas = data || [];
  if (txt){
    const t = txt.toLowerCase();
    filas = filas.filter(f => JSON.stringify(f).toLowerCase().includes(t));
  }
  if ($("#r_cont").checked) filas = filas.filter(f => f.email || f.telefono);
  $("#contRed").textContent = `· ${filas.length}`;
  const rateCampo = ROL==="ADMIN" ? "usd_hora" : "usd_hora_candidato";
  tb.innerHTML = filas.map(f=>{
    const r = f[rateCampo];
    const contacto = f.email
      ? `<a href="mailto:${esc(f.email)}">${esc(f.email)}</a>`
      : (f.telefono ? esc(f.telefono) : `<span class="sincontacto">sin contacto</span>`);
    return `<tr>
      <td><b>${esc(f.nombre)}</b></td>
      <td>${esc(f.pais||"—")}</td>
      <td>${esc(f.seniority||"—")}</td>
      <td class="tabular">${f.anios??"—"}</td>
      <td class="tabular">${r??"—"}</td>
      <td class="tabular">${r?Math.round(r*HS_MES).toLocaleString("es-AR"):"—"}</td>
      <td>${contacto}</td>
      <td style="max-width:360px;font-size:12px;color:var(--ink-2)">${esc((f.tecnologias||"").slice(0,150))}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="8" class="vacio">Ningún analista con esos filtros.</td></tr>`;
}

/* ============ util ============ */
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, m =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }


/* ============ rates: hora <-> mes, 160 hs ============ */
// Cuando escribis en uno, se completa el otro. El que estas tipeando manda.
function enlazarRate(selHora, selMes){
  const hora = $(selHora), mes = $(selMes);
  if (!hora || !mes) return;
  let editando = null;
  hora.addEventListener("input", ()=>{
    if (editando === "mes") return;
    editando = "hora";
    mes.value = hora.value ? Math.round(Number(hora.value)*HS_MES) : "";
    editando = null;
  });
  mes.addEventListener("input", ()=>{
    if (editando === "hora") return;
    editando = "mes";
    hora.value = mes.value ? (Number(mes.value)/HS_MES).toFixed(2) : "";
    editando = null;
  });
}
enlazarRate("#f_budget", "#f_budget_mes");
enlazarRate("#q_rate",   "#q_rate_mes");
enlazarRate("#r_rate",   "#r_rate_mes");

/* ============ eventos ============ */
$("#btnLogin").onclick = entrar;
$("#pass").addEventListener("keydown", e => { if(e.key==="Enter") entrar(); });
$("#btnSalir").onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };

$$("nav button").forEach(b => b.onclick = ()=>{
  $$("nav button").forEach(x=>x.setAttribute("aria-current", x===b));
  $("#vistaBuscar").classList.toggle("hide", b.dataset.vista!=="buscar");
  $("#vistaRed").classList.toggle("hide", b.dataset.vista!=="red");
});

$("#btnAnalizar").onclick = analizar;
$("#btnLimpiar").onclick = ()=>{
  $("#jd").value=""; SKILLS=[]; ULTIMO=null; CANDIDATOS=[]; ELEGIDO=null;
  $("#cardCampos").classList.add("hide");
  $("#resultados").innerHTML = `<div class="vacio">Analizá un pedido para ver candidatos.</div>`;
};
$("#btnBuscar").onclick = buscar;
$("#btnPedirDatos").onclick = pedirDatos;
$("#btnPost").onclick = generarPost;

$("#f_nuevoSkill").addEventListener("keydown", e=>{
  if (e.key==="Enter" && e.target.value.trim()){
    SKILLS.push(e.target.value.trim()); e.target.value=""; pintarChips(); marcarFaltantes();
  }
});
$("#chipsSkills").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  SKILLS.splice(Number(b.dataset.i),1); pintarChips(); marcarFaltantes();
});
CAMPOS.forEach(([sel])=> $(sel).addEventListener("input", marcarFaltantes));

$("#resultados").addEventListener("click", e=>{
  const row = e.target.closest(".rowcard");
  if (row){ ELEGIDO = Number(row.dataset.i); pintarCandidatos(); return; }
  if (e.target.id === "btnMensaje") mensajeCandidato();
  if (e.target.id === "btnCerrarDet"){ ELEGIDO=null; pintarCandidatos(); }
});

$("#btnRecargarRed").onclick = cargarRed;
$("#r_q").addEventListener("keydown", e=>{ if(e.key==="Enter") cargarRed(); });

$("#modalCerrar").onclick = ()=> $("#modal").classList.add("hide");
$("#modal").addEventListener("click", e=>{ if(e.target.id==="modal") $("#modal").classList.add("hide"); });
$("#modalCopiar").onclick = async ()=>{
  const t = ($("#modalAsunto").value ? $("#modalAsunto").value+"\n\n" : "") + $("#modalCuerpo").value;
  await navigator.clipboard.writeText(t);
  $("#modalCopiar").textContent = "Copiado";
  setTimeout(()=> $("#modalCopiar").textContent = "Copiar", 1400);
};
$("#modalMailto").onclick = ()=>{
  const url = `mailto:${encodeURIComponent(MODAL_DEST)}?subject=${encodeURIComponent($("#modalAsunto").value)}&body=${encodeURIComponent($("#modalCuerpo").value)}`;
  window.open(url, "_blank");
};

/* sesión ya abierta */
sb.auth.getSession().then(({data})=>{ if (data.session) arrancar(data.session.user); });
</script>
